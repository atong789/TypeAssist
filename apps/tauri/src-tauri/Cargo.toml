[package]
name = "typeassist-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TypeAssist Tauri shell (Layer 5). Hosts the webview and orchestrates the Swift sidecar."

[lib]
name = "typeassist_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` — the menu-bar entry point (built into core, not a plugin).
# `macos-private-api` — transparent/vibrant Practice panel (rounded floating
# look). Local app, never App-Store-distributed, so the private-API caveat is
# moot here; paired with `"macOSPrivateApi": true` in tauri.conf.json.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
# Anchors the Practice panel under the menu-bar icon (TrayBottomCenter).
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# tokio is already pulled in transitively via tauri/tauri-plugin-shell;
# declared directly here because the engine loop uses `tokio::select!`
# (Tauri's `async_runtime::spawn` wrapper does not re-export the macro)
# and `tokio::sync::mpsc` for the control channel between Tauri
# commands and the engine task.
tokio = { version = "1", features = ["sync", "macros"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

behavioural-model = { path = "../../../crates/behavioural-model" }
volatility-map = { path = "../../../crates/volatility-map" }
correction-engine = { path = "../../../crates/correction-engine" }

# macOS-only: a small native shim so the native tray NSMenu lands its first
# keyboard focus on the topmost ACTIONABLE item (skipping the disabled status
# header), instead of AppKit's stale default. Tauri seals off NSMenu access, so
# we reach the menu via the public NSMenuDidBeginTracking notification. Versions
# pinned to what tauri/muda already resolve, so the NSMenu types are identical.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSArray", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem"] }
block2 = "0.6"
