[package]
name = "typeassist-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TypeAssist Tauri shell (Layer 5). Hosts the webview and orchestrates the Swift sidecar."

[lib]
name = "typeassist_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# tokio is already pulled in transitively via tauri/tauri-plugin-shell;
# declared directly here because the engine loop uses `tokio::select!`
# (Tauri's `async_runtime::spawn` wrapper does not re-export the macro)
# and `tokio::sync::mpsc` for the control channel between Tauri
# commands and the engine task.
tokio = { version = "1", features = ["sync", "macros"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

behavioural-model = { path = "../../../crates/behavioural-model" }
volatility-map = { path = "../../../crates/volatility-map" }
correction-engine = { path = "../../../crates/correction-engine" }
storage = { path = "../../../crates/storage" }
